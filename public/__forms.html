<!doctype html>
<html lang="de">
  <head><meta charset="utf-8"><title>AktenKompass Formulare</title></head>
  <body>
    <form name="aktenkompass-contact" method="POST" data-netlify="true" data-netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="aktenkompass-contact">
      <input name="name" type="text">
      <input name="email" type="email">
      <input name="company" type="text">
      <input name="phone" type="tel">
      <textarea name="message"></textarea>
      <input name="website" type="text">
      <input name="privacyAccepted" type="checkbox">
    </form>
  </body>
</html>
